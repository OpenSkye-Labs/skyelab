<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Fairweather — Bean greets the morning sky</title>
  <defs>
    <clipPath id="tile"><rect x="25" y="25" width="206" height="206" rx="46"/></clipPath>
    <linearGradient id="sky" x1=".12" y1="0" x2=".72" y2="1">
      <stop stop-color="#3D83C7"/><stop offset=".52" stop-color="#76B9E6"/><stop offset="1" stop-color="#C8E3ED"/>
    </linearGradient>
    <linearGradient id="haze" x2=".05" y2="1">
      <stop stop-color="#F1FCFF" stop-opacity=".62"/><stop offset="1" stop-color="#E6F6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glaze" cx=".39" cy=".18" r=".85">
      <stop stop-color="#FFFFFA"/><stop offset=".52" stop-color="#FFF4E4"/>
      <stop offset=".82" stop-color="#EDDFCF"/><stop offset="1" stop-color="#C7C7CB"/>
    </radialGradient>
    <linearGradient id="paw-glaze" x2=".31" y2="1">
      <stop stop-color="#FFFCF2"/><stop offset=".62" stop-color="#F7EBDA"/><stop offset="1" stop-color="#CFBFBA"/>
    </linearGradient>
    <linearGradient id="ink" x2=".3" y2="1">
      <stop stop-color="#203D58"/><stop offset="1" stop-color="#354D69"/>
    </linearGradient>
    <filter id="blur" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="2.1"/></filter>
    <path id="bean" d="M 4 209 C 28 211 46 203 50 191
      C 68 181 61 156 32 149 Q 29 150 27 150
      C 21 125 49 99 76 109 C 92 82 136 80 151 110 Q 154 115 155 121
      C 180 118 198 145 186 167 C 211 194 199 227 173 238
      C 145 250 109 253 83 243 Q 47 250 12 226 Z"/>
    <path id="paw" d="M 17 158 C 29 155 43 162 47 170 C 51 178 48 183 43 184
      Q 40 185 37 182 C 37 191 27 195 17 191 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="25" y="25" width="206" height="206" fill="url(#sky)"/>
    <!-- Distant, nearly level cloud shelves leave the face as the darkest feature. -->
    <path d="M 135 69 Q 141 64 151 64 Q 159 53 172 56 Q 185 37 201 49
      Q 212 45 224 54 Q 233 51 241 54 V 77 H 135 Z" fill="url(#haze)"/>
    <path d="M 162 91 Q 181 88 196 88 Q 204 83 217 85 Q 228 78 239 83
      V 96 H 162 Z" fill="url(#haze)" opacity=".55"/>
    <rect x="25.7" y="25.7" width="204.6" height="204.6" rx="45.3" fill="none" stroke="#E8F8FF" stroke-opacity=".42" stroke-width="1.4"/>
    <g stroke-linejoin="round">
      <use xlink:href="#bean" transform="translate(1 3)" fill="#365C89" stroke="#365C89" stroke-width="10" opacity=".42" filter="url(#blur)"/>
      <use xlink:href="#bean" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8.5"/>
      <use xlink:href="#bean" fill="url(#glaze)" stroke="#385F82" stroke-width="2.5"/>
      <path d="M 86 104 Q 96 91 113 90" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
      <g transform="rotate(11 103 167)">
        <g fill="url(#ink)"><circle cx="74" cy="162" r="10.7"/><circle cx="132" cy="162" r="10.7"/></g>
        <path d="M 93 177 C 97 186 110 186 114 177" fill="none" stroke="#293F55" stroke-width="5.8" stroke-linecap="round"/>
      </g>
      <use xlink:href="#paw" transform="translate(1.1 2.7)" fill="#476687" stroke="#476687" stroke-width="9" opacity=".36" filter="url(#blur)"/>
      <use xlink:href="#paw" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="7.5"/>
      <use xlink:href="#paw" fill="url(#paw-glaze)" stroke="#385F82" stroke-width="2.5"/>
    </g>
  </g>
</svg>
