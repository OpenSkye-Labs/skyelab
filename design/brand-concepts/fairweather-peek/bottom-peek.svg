<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Fairweather — Bottom Peek</title>
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="sky" x1=".12" y1="0" x2=".72" y2="1">
      <stop stop-color="#3D83C7"/><stop offset=".52" stop-color="#76B9E6"/><stop offset="1" stop-color="#C8E3ED"/>
    </linearGradient>
    <linearGradient id="haze" x2=".05" y2="1">
      <stop stop-color="#F1FCFF" stop-opacity=".62"/><stop offset="1" stop-color="#E6F6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glaze" cx=".39" cy=".18" r=".85">
      <stop stop-color="#FFFFFA"/><stop offset=".52" stop-color="#FFF4E4"/>
      <stop offset=".82" stop-color="#EDDFCF"/><stop offset="1" stop-color="#C7C7CB"/>
    </radialGradient>
    <linearGradient id="rim" x2=".5" y2="1">
      <stop stop-color="#E8F8FF" stop-opacity=".58"/><stop offset="1" stop-color="#E8F8FF" stop-opacity=".21"/>
    </linearGradient>
    <linearGradient id="ink" x2=".3" y2="1">
      <stop stop-color="#203D58"/><stop offset="1" stop-color="#354D69"/>
    </linearGradient>
    <filter id="blur" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="2.1"/></filter>
    <path id="bean" d="M 77 256 C 76 238 64 234 59 216
      C 41 212 36 193 46 178 C 40 162 51 144 66 139
      C 63 117 83 101 105 107 C 121 80 162 83 173 114
      C 194 113 207 132 202 151 C 220 166 219 190 201 203
      C 199 222 183 232 175 241 L 171 256 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <g transform="scale(4)">
      <rect x="25" y="25" width="206" height="206" fill="url(#sky)"/>
      <!-- Distant, nearly level cloud shelves leave the face as the darkest feature. -->
      <path d="M 135 69 Q 141 64 151 64 Q 159 53 172 56 Q 185 37 201 49
        Q 212 45 224 54 Q 233 51 241 54 V 77 H 135 Z" fill="url(#haze)"/>
      <path d="M 162 91 Q 181 88 196 88 Q 204 83 217 85 Q 228 78 239 83
        V 96 H 162 Z" fill="url(#haze)" opacity=".55"/>
      <rect x="25.7" y="25.7" width="204.6" height="204.6" rx="45.55" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
      <g stroke-linejoin="round">
        <use xlink:href="#bean" transform="translate(1 3)" fill="#365C89" stroke="#365C89" stroke-width="10" opacity=".42" filter="url(#blur)"/>
        <use xlink:href="#bean" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8.5"/>
        <use xlink:href="#bean" fill="url(#glaze)" stroke="#385F82" stroke-width="2.5"/>
        <path d="M 116 101 Q 126 91 142 91" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
        <g transform="rotate(11 130 164)">
          <g fill="url(#ink)"><circle cx="105" cy="161" r="11.7"/><circle cx="160" cy="161" r="11.7"/></g>
          <path d="M 120 177 C 125 188 138 188 144 177" fill="none" stroke="#293F55" stroke-width="7.2" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
