timeout = 3600
# mobile/ is its own workspace, outside cargo fmt --all here; CI formats only these packages.
repo.mobile-fmt = cd mobile && cargo fmt --check -p skyelab-mobile -p skyelab-mobile-android
# cargo-nextest (.config/nextest.toml; `brew install cargo-nextest` or `cargo install cargo-nextest --locked`) runs every
# test in its own process and all test binaries at once; it doesn't run doc tests, so cargo test does those.
rust.test = cargo nextest run --workspace; t=$?; cargo test --workspace --doc && exit $t
