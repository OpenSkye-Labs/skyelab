name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # rustup installs the channel and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      # Test-only knobs (loopback dialing, test CAs, plaintext) must never reach the shipped app.
      - name: No test-support in the shipping build
        run: |
          for c in skyelab-client skyelab-daemon; do
            if cargo tree --locked --target all -e normal,build -p skyelab-app -i "$c" -f '{p} {f}' | grep test-support; then
              echo "the shipping skyelab-app enables $c/test-support" >&2
              exit 1
            fi
          done

  check:
    name: ${{ matrix.job }} (${{ matrix.os }}${{ matrix.partition && format(' {0}', matrix.partition) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        job: [clippy, test]
        exclude:
          - os: ubuntu-latest
            job: test
        # Linux's tests took twice the other systems' time: three runners each take every third test
        # (nextest's slice partition, after sorting), each building from the shared cache.
        include:
          - { os: ubuntu-latest, job: test, partition: slice:1/3 }
          - { os: ubuntu-latest, job: test, partition: slice:2/3 }
          - { os: ubuntu-latest, job: test, partition: slice:3/3 }
    runs-on: ${{ matrix.os }}
    # A cold build takes ~15 min and the tests ~15 more (Linux, Windows); a warm cache saves most of the build.
    # Time queued for a runner doesn't count.
    timeout-minutes: ${{ matrix.job == 'test' && 70 || 30 }}
    steps:
      # Git for Windows checks text out with CRLF; tests read fixtures and compare text as committed (LF).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install Linux GPUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libvulkan1 libfontconfig-dev clang cmake \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      # GPUI compiles Metal shaders; download the toolchain only if this Xcode image lacks it.
      - name: Ensure Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          if xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            echo "Metal Toolchain already installed"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.job }}
          # Saved even when a test fails: the test job never passed yet, so it rebuilt from scratch every run.
          cache-on-failure: true
      - if: matrix.job == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: matrix.job == 'test'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # cargo-nextest (.config/nextest.toml): every test in its own process, all test binaries at once, never
      # stopping at the first failure, and a test still running at 3 min killed and named.
      # 15 min below the job's 70, so a hang still leaves time to save the cache.
      - if: matrix.job == 'test'
        timeout-minutes: 55
        run: cargo nextest run --workspace --profile ci ${{ matrix.partition && format('--partition {0}', matrix.partition) || '' }}
      # nextest doesn't run doc tests; one Linux shard runs them, even after a failed test step.
      - if: ${{ !cancelled() && matrix.job == 'test' && (!matrix.partition || matrix.partition == 'slice:1/3') }}
        run: cargo test --workspace --doc
