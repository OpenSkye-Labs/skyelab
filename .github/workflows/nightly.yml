name: Nightly

# Run by hand only (Actions → Nightly → Run workflow, on main): builds main's HEAD as the next version's nightly
# (`vX.Y.Z-nightly.YYYYMMDD[.N]`, a semver pre-release that sorts below vX.Y.Z), publishes it as a GitHub pre-release
# (never a draft, never "latest") and keeps the newest 14 nightlies. Stable releases are release.yml's. docs/ci.md.
on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would race for the same day's tag.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Only main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run Nightly on main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" \
            --jq '.total_count')
          if [ "$ok" -lt 1 ]; then
            echo "::error::CI has not succeeded on $SHA; wait for it (or fix main) and run again"
            exit 1
          fi
      # next = Cargo.toml's version without `-dev`, or its patch + 1 when it is a release; N counts this day's nightlies.
      - name: Compute the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$cargo" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-dev$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [[ "$cargo" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "::error::Cargo.toml's version $cargo is neither X.Y.Z nor X.Y.Z-dev"
            exit 1
          fi
          day=$(date -u +%Y%m%d)
          base="$next-nightly.$day"
          # Tags already on the remote for this day: v<base> and v<base>.<N>; the next one follows the highest.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$base" --jq '.[].ref')
          n=$({ grep -oE "^refs/tags/v${base//./\\.}(\.[0-9]+)?$" <<<"$refs" || true; } \
            | sed -E "s/^refs\/tags\/v${base//./\\.}\.?//; s/^$/1/" | sort -n | tail -1)
          if [ -z "$n" ]; then version="$base"; else version="$base.$((n + 1))"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Nightly $version from $cargo at $GITHUB_SHA"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The in-app updater refuses any download that isn't listed here with its SHA-256.
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS . && cat SHA256SUMS
      # Creates the tag on the built commit, published at once as a pre-release; "latest" stays the newest stable.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: SkyeLab ${{ needs.version.outputs.version }}
          prerelease: true
          make_latest: "false"
          draft: false
          generate_release_notes: true
          files: dist/*
      # Keep the newest 14 nightlies; delete older ones with their tags. Only nightly tags match; stable is never touched.
      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}(\.[0-9]+)?$' \
            | sort -V -r | tail -n +15 \
            | while read -r tag; do
                echo "deleting $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
