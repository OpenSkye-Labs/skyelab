name: Mobile

on:
  push:
    branches: [main]
    paths: &paths
      - mobile/**
      - crates/skyelab-protocol/**
      # The app uses skyelab-client; its tests run an in-process skyelab-daemon over skyelab-store and skyelab-tailnet.
      - crates/skyelab-client/**
      - crates/skyelab-daemon/**
      - crates/skyelab-store/**
      - crates/skyelab-tailnet/**
      # skyelab-protocol inherits package fields, deps and lints from the root manifest; clippy reads clippy.toml.
      - Cargo.toml
      - clippy.toml
      - .cargo/**
      - rust-toolchain.toml
      - .github/workflows/mobile.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A main push runs to the end, so main always gets a complete run; other refs cancel their older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: mobile

jobs:
  ios:
    name: iOS simulator build + host checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-apple-ios-sim
      # GPUI compiles Metal shaders; download the toolchain only if this Xcode image lacks it.
      - name: Ensure Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            echo "Metal Toolchain already installed"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile
          key: ios
      - run: scripts/fetch-gpui-mobile.sh
      - run: scripts/check-pins.sh
      # Test-only knobs (loopback dialing, the test CA, the fake tailnet) must never reach a shipping build.
      - name: No test-support in shipping builds
        run: |
          for c in skyelab-client skyelab-daemon; do
            if cargo tree --locked --target all -e normal,build -p skyelab-mobile -p skyelab-mobile-android -i "$c" -f '{p} {f}' | grep test-support; then
              echo "a shipping build enables $c/test-support" >&2
              exit 1
            fi
          done
      # -p, not --all: --all would also check the fetched gpui-mobile and skyelab-protocol (the desktop checks it).
      - run: cargo fmt --check -p skyelab-mobile -p skyelab-mobile-android
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: scripts/check-hosts.sh
      - name: Release build (simulator)
        run: |
          app=$(scripts/build-ios.sh release simulator)
          scripts/check-hosts.sh "$app"
          du -sh "$app"

  android:
    name: Android arm64 build + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      # AGP 9.5 needs JDK 17+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile
          key: android
      - run: scripts/fetch-gpui-mobile.sh
      # The runner image ships the Android SDK and NDK; cargo-ndk reads ANDROID_NDK_HOME.
      - name: Build and lint for arm64-v8a
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P 26 clippy --locked -p skyelab-mobile-android -- -D warnings
      # Before anything runs ./gradlew: checks the committed wrapper jar against the pinned checksum.
      - run: scripts/check-hosts.sh
      - name: Release APK (unsigned)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          apk=$(scripts/build-android.sh release)
          scripts/check-hosts.sh "$apk"
          ls -l "$apk"
