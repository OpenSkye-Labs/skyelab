[workspace]
resolver = "3"
members = ["crates/*"]
# Mobile builds (the spike and the real client) target iOS/Android only and must never break the desktop gate. See docs/mobile.md.
exclude = ["experiments", "mobile"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
# One pin for the whole UI stack: gpui-component 0.11 requires gpui-pre =0.3.14. Bump them together.
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "x11", "wayland"] }
# syntect: the lighter highlighter (file preview, chat code blocks); tree-sitter costs tens of MB more.
gpui-component = { version = "=0.11.0", features = ["syntect"] }
# The system clipboard with an HTML flavor (Copy table as HTML): GPUI's clipboard carries only text, images and paths.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
# Its window text selection (`TextSelection`), which gpui-component doesn't re-export; the version it pins.
gpui-base = "=0.11.0"
# The icon SVGs gpui-component draws; same release as gpui-component, so one copy.
gpui-kit-assets = "=0.11.0"
# Local time: the sidebar's date sections and the timeline's clock times.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Scheduled tasks: cron and daily/weekday times, DST-aware, in the local zone.
croner = { version = "5.0.0", default-features = false, features = ["std", "chrono"] }
# Tests only: a fixed zone with DST changes for schedule math.
chrono-tz = "0.10.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
serde_json = "1"
flume = "0.12"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
alacritty_terminal = "0.26"
rustix-openpty = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }
futures = "0.3"
# waitid(WNOWAIT): see an agent exit before reaping it, while its group id is still its own.
rustix = { version = "1.1", features = ["process", "termios"] }
# A terminal's foreground command and working folder (tab titles, the close check, restore).
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
# Windows Job Objects (kill an agent with its whole process tree), a safe API.
win32job = "2.1"
# The MCP pipe's security descriptor (skyelab-pipe-sys).
windows-sys = "0.61.2"
# Prompt ids claude echoes back in a result (user_message_uuids).
uuid = { version = "1.29", features = ["v4"] }
base64 = "0.23"
# Webview: no `gpui-fast` feature (that is a second GPUI). wry must match the version gpui-webview uses.
gpui-webview = "0.11.0"
wry = { package = "lb-wry", version = "0.53.3" }
# The WKWebView snapshot (skyelab-webkit-sys); same majors as lb-wry, so one copy in the tree.
# The WebKit inspector's private `detach` (skyelab-webkit-sys), same objc2 as objc2-web-kit.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
block2 = "0.6.2"
# Composer dictation on macOS (skyelab-speech-sys): Apple's Speech framework and the audio engine feeding it.
objc2-speech = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFErrors", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAudioApplication", "AVAudioBuffer", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioTime", "AVAudioTypes"] }
# Decodes the snapshot, scales it and writes the PNG; already in the tree through gpui.
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
url = "2.5.9"
# Mermaid diagrams in replies: pure-Rust parse + layout + SVG (no CLI, no PNG feature), rasterized by resvg with
# image hrefs refused. resvg's raster-images stay off: diagrams draw no embedded images.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Linux browser screenshots: the exact webkit2gtk (and its cairo-rs) lb-wry pins, so the snapshot's types match.
webkit2gtk = "=2.0.1"
cairo-rs = { version = "0.18.5", features = ["png"] }
# Project file walk and content search (ripgrep's crates, no external binary).
ignore = "0.4.35"
grep-searcher = "0.1.18"
grep-regex = "0.1.15"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.30"
# TLS: ring, not aws-lc (no cmake/NASM, builds for iOS and Android). TLS 1.3 only; both ends are ours.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
x509-parser = "0.18"
rcgen = "0.14"
# SHA-256 and the system RNG for device keys; already in the tree through rustls.
ring = "0.17"
# The macOS keychain, for the desktop's device key. Already in the tree.
security-framework = "3.7"
tungstenite = "0.30"
skyelab-core = { path = "crates/skyelab-core" }
skyelab-browser = { path = "crates/skyelab-browser" }
skyelab-webkit-sys = { path = "crates/skyelab-webkit-sys" }
skyelab-speech-sys = { path = "crates/skyelab-speech-sys" }
skyelab-pipe-sys = { path = "crates/skyelab-pipe-sys" }
skyelab-devices = { path = "crates/skyelab-devices" }
skyelab-protocol = { path = "crates/skyelab-protocol" }
skyelab-client = { path = "crates/skyelab-client" }
skyelab-store = { path = "crates/skyelab-store" }
skyelab-tailnet = { path = "crates/skyelab-tailnet" }
skyelab-terminal = { path = "crates/skyelab-terminal" }
skyelab-agent = { path = "crates/skyelab-agent" }
skyelab-daemon = { path = "crates/skyelab-daemon" }
skyelab-git = { path = "crates/skyelab-git" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2 # GPUI is unusably slow unoptimized; our own crates stay fast to compile.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
