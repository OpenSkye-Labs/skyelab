[workspace]
resolver = "3"
members = ["crates/*"]
# Mobile builds (the spike and the real client) target iOS/Android only and must never break the desktop gate. See docs/mobile.md.
exclude = ["experiments", "mobile"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
# One pin for the whole UI stack: gpui-component 0.10 requires gpui-pre =0.3.12. Bump them together.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland"] }
gpui-component = "=0.10.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
serde_json = "1"
flume = "0.12"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
alacritty_terminal = "0.26"
rustix-openpty = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }
futures = "0.3"
# waitid(WNOWAIT): see an agent exit before reaping it, while its group id is still its own.
rustix = { version = "1.1", features = ["process"] }
# Windows Job Objects (kill an agent with its whole process tree), a safe API.
win32job = "2.1"
# Prompt ids claude echoes back in a result (user_message_uuids).
uuid = { version = "1.29", features = ["v4"] }
# Webview: no `gpui-fast` feature (that is a second GPUI). wry must match the version gpui-webview uses.
gpui-webview = "0.10.0"
wry = { package = "lb-wry", version = "0.53.3" }
url = "2.5.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.30"
# TLS: ring, not aws-lc (no cmake/NASM, builds for iOS and Android). TLS 1.3 only; both ends are ours.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
x509-parser = "0.18"
rcgen = "0.14"
# SHA-256 and the system RNG for device keys; already in the tree through rustls.
ring = "0.17"
# The macOS keychain, for the desktop's device key. Already in the tree.
security-framework = "3.7"
tungstenite = "0.30"
skyelab-core = { path = "crates/skyelab-core" }
skyelab-browser = { path = "crates/skyelab-browser" }
skyelab-devices = { path = "crates/skyelab-devices" }
skyelab-protocol = { path = "crates/skyelab-protocol" }
skyelab-client = { path = "crates/skyelab-client" }
skyelab-store = { path = "crates/skyelab-store" }
skyelab-tailnet = { path = "crates/skyelab-tailnet" }
skyelab-terminal = { path = "crates/skyelab-terminal" }
skyelab-agent = { path = "crates/skyelab-agent" }
skyelab-daemon = { path = "crates/skyelab-daemon" }
skyelab-git = { path = "crates/skyelab-git" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2 # GPUI is unusably slow unoptimized; our own crates stay fast to compile.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
