[workspace]
resolver = "3"
# Not ".": listing the root as a member makes cargo ignore `exclude` and adopt the fetched checkout.
members = ["android"]
exclude = ["target/gpui-mobile"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
# The desktop's exact GPUI pins (root Cargo.toml); scripts/check-pins.sh fails CI when they differ.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false }
gpui-component = "=0.10.0"
# gpui-mobile's Android text system, run on the host by android/tests/emoji_font.rs. Follows the gpui pin (check-pins.sh).
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
# The iOS platform gpui-pre-platform already pulls in; named here only for its status-bar style. Follows the gpui pin.
gpui_ios = { package = "gpui-pre-ios", version = "=0.3.12" }
# longbridge/gpui-mobile ported to gpui-pre 0.3.12: scripts/fetch-gpui-mobile.sh clones and patches it.
gpui-mobile = { package = "gpui-pre-mobile", path = "target/gpui-mobile", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[package]
name = "skyelab-mobile"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

# iOS: a plain binary, bundled into an .app by scripts/run-ios.sh. Android loads `android/` as a cdylib instead.
[[bin]]
name = "skyelab_mobile"
path = "src/main.rs"

[features]
# Canned data instead of a real environment, for UI checks on a simulator or emulator (scripts/run-*.sh read
# SKYELAB_MOBILE_FEATURES). Never in a shipping build.
demo = []

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
skyelab-protocol = { path = "../crates/skyelab-protocol" }
skyelab-client = { path = "../crates/skyelab-client" }
# The desktop's timeline model (`timeline`) and thread-list text, so both apps read stored rows the same way.
skyelab-agent = { path = "../crates/skyelab-agent" }
anyhow = "1"
flume = "0.12"
serde_json = "1"

# gpui-pre-platform 0.3.12 pulls gpui-pre-ios on target_os = "ios". It has no Android arm (android/ uses gpui-mobile).
[target.'cfg(not(target_os = "android"))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
tempfile = "3"
# Tests dial an in-process daemon on loopback; the feature exists for that and stays out of the app.
skyelab-client = { path = "../crates/skyelab-client", features = ["test-support"] }
skyelab-daemon = { path = "../crates/skyelab-daemon", features = ["test-support"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
skyelab-store = { path = "../crates/skyelab-store" }
skyelab-tailnet = { path = "../crates/skyelab-tailnet" }

[lints]
workspace = true

[profile.dev]
# wgpu turns on Vulkan debug labels under debug assertions, and the Android emulator's llvmpipe driver segfaults in
# vkSetDebugUtilsObjectNameEXT. See docs/mobile.md, "Problems found".
debug-assertions = false

# Tests run on the host, never on the emulator: keep debug assertions there, which GPUI's `debug_selector` (tap-target
# checks in tests/touch_targets.rs) needs.
[profile.test]
debug-assertions = true

[profile.dev.package."*"]
opt-level = 2 # GPUI is unusably slow unoptimized.

# accesskit_android 0.7.5 (event.rs, text-changed events) computes `old.len() - 1` on an empty string. Release wraps it to
# -1 as a jint, which is the value its algorithm expects; dev's overflow check panics on the first typed character.
[profile.dev.package.accesskit_android]
overflow-checks = false

# Shipping builds (scripts/build-*.sh release): size over speed. GPUI stays usable at "z"; see docs/mobile.md for sizes.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
