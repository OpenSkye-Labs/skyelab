# The iOS and Android client. Its own workspace and lockfile, excluded from the desktop one (root Cargo.toml), so
# mobile builds never slow or break the desktop gate. See docs/mobile.md.
[workspace]
resolver = "3"
members = ["android"] # plus the root package
# The fetched gpui-mobile checkout: a path dependency, not one of ours.
exclude = ["target/gpui-mobile"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
# longbridge/gpui-mobile ported to gpui-pre 0.3.12: scripts/fetch-gpui-mobile.sh clones and patches it.
gpui-mobile = { package = "gpui-pre-mobile", path = "target/gpui-mobile", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[package]
name = "skyelab-mobile"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

# iOS: a plain binary, bundled into an .app by scripts/run-ios.sh. Android loads `android/` as a cdylib instead.
[[bin]]
name = "skyelab_mobile"
path = "src/main.rs"

[dependencies]
# The exact desktop pins (root Cargo.toml). Bump them together with the desktop.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.10.0"
skyelab-protocol = { path = "../crates/skyelab-protocol" }
anyhow = "1"
serde_json = "1"

# gpui-pre-platform 0.3.12 pulls gpui-pre-ios on target_os = "ios". It has no Android arm (android/ uses gpui-mobile).
[target.'cfg(not(target_os = "android"))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-component = { version = "=0.10.0", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

[profile.dev]
# wgpu turns on Vulkan debug labels under debug assertions, and the Android emulator's llvmpipe driver segfaults in
# vkSetDebugUtilsObjectNameEXT. See docs/mobile.md, "Problems found".
debug-assertions = false

[profile.dev.package."*"]
opt-level = 2 # GPUI is unusably slow unoptimized.

# accesskit_android 0.7.5 (event.rs, text-changed events) computes `old.len() - 1` on an empty string. Release wraps it to
# -1 as a jint, which is the value its algorithm expects; dev's overflow check panics on the first typed character.
[profile.dev.package.accesskit_android]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
