<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Fairweather Tinted — Embossed Frost</title>
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="tile-bg" x1=".12" y1="0" x2=".72" y2="1">
      <stop stop-color="#141414"/><stop offset=".52" stop-color="#1C1C1C"/><stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="haze" x2=".05" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".15"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="frost" cx=".36" cy=".18" r=".88">
      <stop stop-color="#FFFFFF" stop-opacity=".35"/><stop offset=".52" stop-color="#E8E8E8" stop-opacity=".22"/>
      <stop offset=".84" stop-color="#C0C0C0" stop-opacity=".12"/><stop offset="1" stop-color="#989898" stop-opacity=".07"/>
    </radialGradient>
    <linearGradient id="bean-rim" x1=".12" y1="0" x2=".82" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset=".55" stop-color="#E4E4E4" stop-opacity=".86"/>
      <stop offset="1" stop-color="#BDBDBD" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="rim" x2=".5" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".38"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="face" x2=".3" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E0E0E0"/>
    </linearGradient>
    <filter id="blur" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="2.4"/></filter>
    <path id="bean" d="M 3 179 Q 12 153 21 145
      C 22 117 52 98 77 109 C 96 80 137 83 152 110 Q 155 116 156 121
      C 181 119 199 144 187 167 C 212 194 203 222 178 244
      Q 104 275 11 242 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <g transform="scale(4)">
      <rect x="25" y="25" width="206" height="206" fill="url(#tile-bg)"/>
      <!-- Monochrome distant cloud shelves preserve open sky above Bean. -->
      <path d="M 135 69 Q 141 64 151 64 Q 159 53 172 56 Q 185 37 201 49
        Q 212 45 224 54 Q 233 51 241 54 V 77 H 135 Z" fill="url(#haze)"/>
      <path d="M 162 91 Q 181 88 196 88 Q 204 83 217 85 Q 228 78 239 83
        V 96 H 162 Z" fill="url(#haze)" opacity=".48"/>
      <rect x="25.7" y="25.7" width="204.6" height="204.6" rx="45.55" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <g stroke-linejoin="round">
        <use xlink:href="#bean" transform="translate(1.5 3.5)" fill="#000000" stroke="#000000" stroke-width="9" opacity=".52" filter="url(#blur)"/>
        <use xlink:href="#bean" fill="url(#frost)" stroke="url(#bean-rim)" stroke-width="7.2"/>
        <path d="M 88 103 Q 99 91 114 90" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity=".82"/>
        <g transform="rotate(11 105 163)">
          <g fill="url(#face)"><circle cx="74" cy="160" r="13.0"/><circle cx="137" cy="160" r="13.0"/></g>
          <path d="M 93 177 C 98 189 113 189 119 177" fill="none" stroke="#F7F7F7" stroke-width="7.6" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
