<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Fairweather Dark — Starlit Indigo</title>
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="sky" x1=".12" y1="0" x2=".72" y2="1">
      <stop stop-color="#0B1124"/><stop offset=".52" stop-color="#162952"/><stop offset="1" stop-color="#27467C"/>
    </linearGradient>
    <linearGradient id="haze" x2=".05" y2="1">
      <stop stop-color="#8AB8F8" stop-opacity=".26"/><stop offset="1" stop-color="#608AD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bean-rim" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#ECF4FF"/><stop offset="1" stop-color="#BBD4F6"/>
    </linearGradient>
    <radialGradient id="glaze" cx=".39" cy=".18" r=".85">
      <stop stop-color="#F4F8FF"/><stop offset=".52" stop-color="#E1EBFA"/>
      <stop offset=".82" stop-color="#C0CFE7"/><stop offset="1" stop-color="#94A8C8"/>
    </radialGradient>
    <linearGradient id="rim" x2=".5" y2="1">
      <stop stop-color="#A8CEFF" stop-opacity=".42"/><stop offset="1" stop-color="#5B8CE6" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="ink" x2=".3" y2="1">
      <stop stop-color="#12233E"/><stop offset="1" stop-color="#213A5E"/>
    </linearGradient>
    <filter id="blur" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="2.2"/></filter>
    <path id="bean" d="M 3 179 Q 12 153 21 145
      C 22 117 52 98 77 109 C 96 80 137 83 152 110 Q 155 116 156 121
      C 181 119 199 144 187 167 C 212 194 203 222 178 244
      Q 104 275 11 242 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <g transform="scale(4)">
      <rect x="25" y="25" width="206" height="206" fill="url(#sky)"/>
      <!-- Quiet starlight accents in open upper sky. -->
      <path d="M 64 49.5 Q 64 54 68.5 54 Q 64 54 64 58.5 Q 64 54 59.5 54 Q 64 54 64 49.5 Z" fill="#E6F1FF" opacity=".78"/>
      <circle cx="95" cy="43" r="1.5" fill="#D5E8FF" opacity=".62"/>
      <circle cx="147" cy="41" r="1.2" fill="#C7DFFF" opacity=".48"/>
      <!-- Distant night cloud shelves preserve open sky above Bean. -->
      <path d="M 135 69 Q 141 64 151 64 Q 159 53 172 56 Q 185 37 201 49
        Q 212 45 224 54 Q 233 51 241 54 V 77 H 135 Z" fill="url(#haze)"/>
      <path d="M 162 91 Q 181 88 196 88 Q 204 83 217 85 Q 228 78 239 83
        V 96 H 162 Z" fill="url(#haze)" opacity=".50"/>
      <rect x="25.7" y="25.7" width="204.6" height="204.6" rx="45.55" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <g stroke-linejoin="round">
        <use xlink:href="#bean" transform="translate(1 3.2)" fill="#060D1E" stroke="#060D1E" stroke-width="10.5" opacity=".62" filter="url(#blur)"/>
        <use xlink:href="#bean" fill="url(#bean-rim)" stroke="url(#bean-rim)" stroke-width="8.5"/>
        <use xlink:href="#bean" fill="url(#glaze)" stroke="#26416B" stroke-width="2.5"/>
        <path d="M 88 103 Q 99 91 114 90" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".84"/>
        <g transform="rotate(11 105 163)">
          <g fill="url(#ink)"><circle cx="74" cy="160" r="12.7"/><circle cx="137" cy="160" r="12.7"/></g>
          <path d="M 93 177 C 98 189 113 189 119 177" fill="none" stroke="#182C4A" stroke-width="7.2" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
