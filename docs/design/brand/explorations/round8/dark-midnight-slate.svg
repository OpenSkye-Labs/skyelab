<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Fairweather Dark — Midnight Slate</title>
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="sky" x1=".12" y1="0" x2=".72" y2="1">
      <stop stop-color="#0D1017"/><stop offset=".52" stop-color="#141C2B"/><stop offset="1" stop-color="#1F2E47"/>
    </linearGradient>
    <radialGradient id="sky-glow" cx=".38" cy=".64" r=".58">
      <stop stop-color="#4C6FE0" stop-opacity=".26"/><stop offset="1" stop-color="#4C6FE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x2=".05" y2="1">
      <stop stop-color="#7EA9E8" stop-opacity=".22"/><stop offset="1" stop-color="#5378B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bean-rim" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#B6D8FF"/><stop offset=".55" stop-color="#6EA8FF"/><stop offset="1" stop-color="#4A7EE0"/>
    </linearGradient>
    <radialGradient id="glaze" cx=".39" cy=".18" r=".85">
      <stop stop-color="#3C5070"/><stop offset=".52" stop-color="#293854"/>
      <stop offset=".84" stop-color="#1B263B"/><stop offset="1" stop-color="#131B2A"/>
    </radialGradient>
    <linearGradient id="rim" x2=".5" y2="1">
      <stop stop-color="#96C0FF" stop-opacity=".40"/><stop offset="1" stop-color="#5B82BD" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="face" x2=".3" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE9FA"/>
    </linearGradient>
    <filter id="blur" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="2.4"/></filter>
    <path id="bean" d="M 3 179 Q 12 153 21 145
      C 22 117 52 98 77 109 C 96 80 137 83 152 110 Q 155 116 156 121
      C 181 119 199 144 187 167 C 212 194 203 222 178 244
      Q 104 275 11 242 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <g transform="scale(4)">
      <rect x="25" y="25" width="206" height="206" fill="url(#sky)"/>
      <rect x="25" y="25" width="206" height="206" fill="url(#sky-glow)"/>
      <!-- Distant night cloud shelves preserve open sky above Bean. -->
      <path d="M 135 69 Q 141 64 151 64 Q 159 53 172 56 Q 185 37 201 49
        Q 212 45 224 54 Q 233 51 241 54 V 77 H 135 Z" fill="url(#haze)"/>
      <path d="M 162 91 Q 181 88 196 88 Q 204 83 217 85 Q 228 78 239 83
        V 96 H 162 Z" fill="url(#haze)" opacity=".50"/>
      <rect x="25.7" y="25.7" width="204.6" height="204.6" rx="45.55" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <g stroke-linejoin="round">
        <use xlink:href="#bean" transform="translate(1 3.5)" fill="#05080F" stroke="#05080F" stroke-width="11" opacity=".68" filter="url(#blur)"/>
        <use xlink:href="#bean" fill="url(#bean-rim)" stroke="url(#bean-rim)" stroke-width="8.5"/>
        <use xlink:href="#bean" fill="url(#glaze)" stroke="#101827" stroke-width="2.4"/>
        <path d="M 88 103 Q 99 91 114 90" fill="none" stroke="#CFE3FF" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
        <g transform="rotate(11 105 163)">
          <g fill="url(#face)"><circle cx="74" cy="160" r="12.7"/><circle cx="137" cy="160" r="12.7"/></g>
          <path d="M 93 177 C 98 189 113 189 119 177" fill="none" stroke="#ECF4FF" stroke-width="7.4" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
