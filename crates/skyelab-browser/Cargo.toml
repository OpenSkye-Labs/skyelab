[package]
name = "skyelab-browser"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
flume.workspace = true
futures.workspace = true
image.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-webview.workspace = true
serde_json.workspace = true
skyelab-core.workspace = true
url.workspace = true
wry.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
skyelab-webkit-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk.workspace = true
cairo-rs.workspace = true

[dev-dependencies]
gpui_platform.workspace = true

# A real window and WKWebView: it needs the main thread, so no libtest harness.
[[test]]
name = "wkwebview_eval"
harness = false

# A real WKWebView snapshot, main thread too.
[[test]]
name = "wkwebview_screenshot"
harness = false

# A visual reply's locked page and its hidden snapshot, main thread too.
[[test]]
name = "wkwebview_page"
harness = false

# A private tab's navigation, download and popup rules, main thread too.
[[test]]
name = "wkwebview_private"
harness = false

[lints]
workspace = true
