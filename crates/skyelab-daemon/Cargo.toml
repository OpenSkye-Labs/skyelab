[package]
name = "skyelab-daemon"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
skyelab-core.workspace = true
skyelab-protocol.workspace = true
skyelab-store.workspace = true
skyelab-tailnet.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
rcgen = { workspace = true, optional = true }
serde_json.workspace = true
tempfile = { workspace = true, optional = true }

[features]
# The shared remote-test harness (test CA, fake tailnet, served store) for this and other crates' tests.
# Never in a shipped build.
test-support = ["dep:rcgen", "dep:tempfile"]

[dev-dependencies]
skyelab-daemon = { workspace = true, features = ["test-support"] }
skyelab-client = { workspace = true, features = ["test-support"] }
rustls.workspace = true
tungstenite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
