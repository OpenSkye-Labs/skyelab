[package]
name = "skyelab-terminal"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
skyelab-core.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-component.workspace = true
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
rustix-openpty.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[lints]
workspace = true

[features]
# Tests: a terminal with no command runs a shell that reads no startup file (never the developer's rc). Only
# dev-dependencies turn it on, so `cargo build`/`cargo run` keep the user's login shell. Never in a shipped build.
test-support = []

[dev-dependencies]
skyelab-terminal = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
