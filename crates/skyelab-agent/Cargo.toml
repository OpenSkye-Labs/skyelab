[package]
name = "skyelab-agent"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
flume.workspace = true
skyelab-core.workspace = true
tracing.workspace = true
# Function timing for `--features hotpath` builds (docs/debugging.md); nothing when off.
hotpath = { workspace = true, optional = true }
skyelab-protocol.workspace = true
uuid.workspace = true
base64.workspace = true
tempfile.workspace = true
# Optional: the mobile client builds this crate without it (sysinfo needs a newer libc than its iOS pin).
sysinfo = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
tokio.workspace = true
skyelab-pipe-sys.workspace = true

[features]
default = ["process-tree"]
# Ending the commands an interrupted Codex turn left running.
process-tree = ["dep:sysinfo"]
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
