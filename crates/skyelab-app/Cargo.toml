[package]
name = "skyelab-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "An agentic development environment where every folder is bound to one provider account."

[[bin]]
name = "skyelab"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
arboard.workspace = true
gpui-kit-assets.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
markdown.workspace = true
skyelab-core.workspace = true
skyelab-speech-sys.workspace = true
skyelab-terminal.workspace = true
skyelab-browser.workspace = true
skyelab-store.workspace = true
skyelab-agent.workspace = true
skyelab-daemon.workspace = true
skyelab-protocol.workspace = true
skyelab-client.workspace = true
skyelab-tailnet.workspace = true
flume.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
skyelab-devices.workspace = true
skyelab-git.workspace = true
# devices: screenshot temp files
tempfile.workspace = true
dirs.workspace = true
mermaid-rs-renderer.workspace = true
resvg.workspace = true
# Debug mode (docs/debugging.md): the dump's child processes, the SKYELAB_TRACE trace.
sysinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-chrome.workspace = true
# Opt-in profilers, each behind a feature below; none is in a default build.
hotpath = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }
console-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["tracing"] }

[features]
# Function timing on the hot paths, report on quit: `cargo run -p skyelab-app --release --features hotpath`.
hotpath = [
    "dep:hotpath",
    "hotpath/hotpath",
    "skyelab-core/hotpath",
    "skyelab-store/hotpath",
    "skyelab-agent/hotpath",
    "skyelab-daemon/hotpath",
]
# The same, plus bytes allocated per function (replaces the global allocator; not with dhat-heap).
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# dhat heap profile written on quit; open it in https://nnethercote.github.io/dh_view/dh_view.html.
dhat-heap = ["dep:dhat"]
# Live profiling in the Tracy profiler app.
tracy = ["dep:tracing-tracy"]
# tokio-console for the daemon and client runtimes; also needs RUSTFLAGS="--cfg tokio_unstable".
tokio-console = ["dep:console-subscriber", "dep:tokio"]
# GPUI's own frame-time overlay, drawn with ours (adds GPUI's per-task timing).
gpui-profiler = ["gpui/profiler"]

[lints]
workspace = true

[dev-dependencies]
image.workspace = true
rusqlite.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
skyelab-daemon = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tungstenite.workspace = true
skyelab-client = { workspace = true, features = ["test-support"] }
rustls.workspace = true
# The fake https remote (skyelab-git's tests/support/https_remote.rs) for the clone test.
base64.workspace = true
rcgen.workspace = true

[package.metadata.packager]
product-name = "SkyeLab"
identifier = "dev.openskye.skyelab"
publisher = "OpenSkye"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p skyelab-app"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/256x256.png", "icons/512x512.png", "icons/icon.icns", "icons/icon.ico"]

[package.metadata.packager.macos]
minimum-system-version = "14.0"
# Ad hoc, so the bundle verifies with its identifier and entitlements (the linker's signature covers only the binary).
signing-identity = "-"
# The microphone and speech recognition usage strings (dictation), and the microphone under the hardened runtime.
info-plist-path = "macos/Info.plist"
entitlements = "macos/entitlements.plist"

[package.metadata.packager.deb]
# webkit2gtk and gtk for wry's webview, the rest for GPUI.
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxkbcommon-x11-0", "libvulkan1"]
