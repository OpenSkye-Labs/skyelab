[package]
name = "skyelab-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "An agentic development environment where every folder is bound to one provider account."

[[bin]]
name = "skyelab"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
anyhow.workspace = true
skyelab-core.workspace = true
skyelab-terminal.workspace = true
skyelab-browser.workspace = true
dirs.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# `cargo packager --release` (cargo-packager). See CLAUDE.md "Release".
[package.metadata.packager]
product-name = "SkyeLab"
identifier = "dev.openskye.skyelab"
publisher = "OpenSkye"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p skyelab-app"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/256x256.png", "icons/512x512.png", "icons/512x512@2x.png", "icons/icon.ico"]

[package.metadata.packager.macos]
minimum-system-version = "14.0"

[package.metadata.packager.windows]
# Signing only runs once CI adds `certificate-thumbprint` (see release.yml).
digest-algorithm = "SHA256"
timestamp-url = "http://timestamp.digicert.com"

[package.metadata.packager.deb]
# wry's Linux webview.
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxkbcommon-x11-0", "libvulkan1"]
