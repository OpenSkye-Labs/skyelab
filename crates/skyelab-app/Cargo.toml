[package]
name = "skyelab-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "An agentic development environment where every folder is bound to one provider account."

[[bin]]
name = "skyelab"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
arboard.workspace = true
gpui-kit-assets.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
skyelab-core.workspace = true
skyelab-terminal.workspace = true
skyelab-browser.workspace = true
skyelab-store.workspace = true
skyelab-agent.workspace = true
skyelab-daemon.workspace = true
skyelab-protocol.workspace = true
skyelab-client.workspace = true
skyelab-tailnet.workspace = true
flume.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
skyelab-devices.workspace = true
skyelab-git.workspace = true
# devices: screenshot temp files
tempfile.workspace = true
dirs.workspace = true
mermaid-rs-renderer.workspace = true
resvg.workspace = true

[lints]
workspace = true

[dev-dependencies]
image.workspace = true
rusqlite.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
skyelab-daemon = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tungstenite.workspace = true
skyelab-client = { workspace = true, features = ["test-support"] }
rustls.workspace = true

[package.metadata.packager]
product-name = "SkyeLab"
identifier = "dev.openskye.skyelab"
publisher = "OpenSkye"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p skyelab-app"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/256x256.png", "icons/512x512.png", "icons/icon.icns", "icons/icon.ico"]

[package.metadata.packager.macos]
minimum-system-version = "14.0"

[package.metadata.packager.deb]
# webkit2gtk and gtk for wry's webview, the rest for GPUI.
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxkbcommon-x11-0", "libvulkan1"]
