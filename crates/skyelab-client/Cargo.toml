[package]
name = "skyelab-client"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[features]
# Lets other crates' tests dial their in-process daemon on loopback (`Options::allow_loopback`).
test-support = []

[dependencies]
flume.workspace = true
futures.workspace = true
serde_json.workspace = true
skyelab-core.workspace = true
tracing.workspace = true
skyelab-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki.workspace = true
webpki-roots.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
anyhow.workspace = true
skyelab-daemon = { workspace = true, features = ["test-support"] }
skyelab-store.workspace = true
skyelab-tailnet.workspace = true
tempfile.workspace = true
tungstenite.workspace = true

[lints]
workspace = true
